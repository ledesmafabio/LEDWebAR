<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>LED AR Experience Creator — Visor</title>
  
  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    
    /* ========== LOADER ========== */
    .arjs-loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      transition: opacity 0.4s;
    }
    .arjs-loader.hidden { opacity: 0; pointer-events: none; }
    .arjs-loader h2 {
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .arjs-loader p {
      font-size: clamp(13px, 3.5vw, 15px);
      color: #aaa;
      max-width: 280px;
      line-height: 1.4;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ========== ERROR / DENIED SCREEN ========== */
    .error-screen {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 10000;
    }
    .error-screen.active { display: flex; }
    .error-screen .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255,59,48,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .error-screen h2 {
      font-size: clamp(18px, 4.5vw, 22px);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .error-screen p {
      color: #aaa;
      font-size: clamp(13px, 3.5vw, 15px);
      max-width: 300px;
      line-height: 1.5;
    }
    .error-screen .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
      width: min(280px, 80vw);
    }
    .error-screen .btn {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-height: 48px;
      transition: opacity 0.2s;
    }
    .error-screen .btn-primary {
      background: #0071e3;
      color: #fff;
    }
    .error-screen .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .error-screen .btn:active { opacity: 0.8; }
    
    /* ========== UI OVERLAY ========== */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
      padding-top: env(safe-area-inset-top);
    }
    .ui-bar {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ui-bar .title {
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }
    .ui-bar .meta {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 1px;
    }
    .ui-bar .btn {
      pointer-events: auto;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ui-bar .btn:active { background: rgba(255,255,255,0.25); }
    
    /* ========== STATUS PILL ========== */
    .status-pill {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: clamp(12px, 3.2vw, 14px);
      z-index: 100;
      transition: all 0.3s;
      white-space: nowrap;
      text-align: center;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-pill.found {
      background: rgba(52,199,89,0.85);
    }
    
    /* ========== MARKER GUIDE ========== */
    .marker-guide {
      position: fixed;
      bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px));
      left: 50%;
      transform: translateX(-50%);
      width: clamp(100px, 28vw, 140px);
      height: clamp(100px, 28vw, 140px);
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 8px;
      z-index: 50;
      pointer-events: none;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.45);
      font-size: clamp(11px, 2.8vw, 13px);
      text-align: center;
      line-height: 1.3;
    }
    .marker-guide.active { display: flex; }
    .marker-guide svg {
      width: clamp(24px, 6vw, 32px);
      height: clamp(24px, 6vw, 32px);
      margin-bottom: 4px;
      opacity: 0.5;
    }
    
    /* ========== A-FRAME FIXES ========== */
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      position: fixed !important;
      top: 0;
      left: 0;
    }
    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* ========== RESPONSIVE ========== */
    @media (max-width: 380px) {
      .ui-bar { padding: 8px 10px; }
      .ui-bar .btn { padding: 6px 10px; font-size: 11px; }
    }
    @media (max-height: 600px) {
      .arjs-loader h2 { margin-bottom: 6px; }
      .arjs-loader p { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  
  <!-- ========== LOADER (visible inmediatamente) ========== -->
  <div class="arjs-loader" id="loader">
    <div class="spinner"></div>
    <h2 id="loaderTitle">Solicitando acceso a cámara…</h2>
    <p id="loaderText">Tu navegador mostrará un diálogo de permisos. Selecciona "Permitir".</p>
  </div>
  
  <!-- ========== ERROR / DENIED SCREEN ========== -->
  <div class="error-screen" id="errorScreen">
    <div class="icon-wrap" id="errorIcon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h2 id="errorTitle">Experiencia no encontrada</h2>
    <p id="errorText">El ID de esta experiencia no existe en este dispositivo.</p>
    <div class="actions">
      <button class="btn btn-primary" id="retryBtn" onclick="retryCamera()" style="display:none;">Reintentar acceso a cámara</button>
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">Ir al panel admin</button>
    </div>
  </div>
  
  <!-- ========== UI OVERLAY ========== -->
  <div class="ui-overlay" id="uiOverlay" style="display:none;">
    <div class="ui-bar">
      <div style="min-width:0;">
        <div class="title" id="expTitle">Experiencia AR</div>
        <div class="meta" id="expMeta">Marcador Hiro</div>
      </div>
      <button class="btn" onclick="toggleFullscreen()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Pantalla completa
      </button>
    </div>
  </div>
  
  <div class="status-pill" id="statusPill" style="display:none;">
    🔍 Apunta la cámara al marcador Hiro
  </div>
  
  <div class="marker-guide" id="markerGuide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>
    <span>Marcador<br>Hiro</span>
  </div>
  
  <!-- ========== A-FRAME SCENE ========== -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium; antialias: false;"
    id="arScene"
    style="display:none;">
    
    <a-assets id="assetsContainer" timeout="10000"></a-assets>
    
    <a-marker preset="hiro" id="hiroMarker" emitevents="true" smooth="true" smoothCount="5">
      <a-entity id="contentAnchor" position="0 0 0" rotation="-90 0 0"></a-entity>
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ===== CONFIG =====
    const STORAGE_KEY = 'ar-web-experiences';
    const urlParams = new URLSearchParams(window.location.search);
    const expId = urlParams.get('id');
    
    const loader = document.getElementById('loader');
    const loaderTitle = document.getElementById('loaderTitle');
    const loaderText = document.getElementById('loaderText');
    const errorScreen = document.getElementById('errorScreen');
    const errorTitle = document.getElementById('errorTitle');
    const errorText = document.getElementById('errorText');
    const errorIcon = document.getElementById('errorIcon');
    const retryBtn = document.getElementById('retryBtn');
    const scene = document.getElementById('arScene');
    const contentAnchor = document.getElementById('contentAnchor');
    const statusPill = document.getElementById('statusPill');
    const markerGuide = document.getElementById('markerGuide');
    const uiOverlay = document.getElementById('uiOverlay');
    
    let cameraStream = null;
    let experienceLoaded = false;
    
    // ===== AUTO-REQUEST CAMERA ON LOAD =====
    window.addEventListener('load', () => {
      // Pequeño delay para que el navegador termine de renderizar antes del prompt
      setTimeout(startCameraFlow, 300);
    });
    
    async function startCameraFlow() {
      // Primero validamos que exista la experiencia
      if (!expId) {
        showErrorScreen(
          'ID no especificado',
          'No se proporcionó un ID de experiencia en la URL. Escanea un QR válido o ve al panel admin.',
          false
        );
        return;
      }
      
      const experiences = getExperiences();
      const exp = experiences.find(e => e.id === expId);
      
      if (!exp) {
        showErrorScreen(
          'Experiencia no encontrada',
          'Esta experiencia no existe en este dispositivo. Si la creaste en otro navegador, usa Exportar/Importar en el panel admin.',
          false
        );
        return;
      }
      
      // Guardar referencia para usar después
      window._currentExp = exp;
      
      // Solicitar cámara inmediatamente
      await requestCamera();
    }
    
    async function requestCamera() {
      loaderTitle.textContent = 'Solicitando acceso a cámara…';
      loaderText.textContent = 'Tu navegador mostrará un diálogo de permisos. Selecciona "Permitir".';
      loader.classList.remove('hidden');
      errorScreen.classList.remove('active');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        
        cameraStream = stream;
        
        // Éxito: iniciar AR
        loaderTitle.textContent = 'Iniciando AR…';
        loaderText.textContent = 'Cargando detector de marcadores';
        
        if (window._currentExp) {
          initAR(window._currentExp);
        }
        
      } catch (err) {
        console.error('Camera error:', err);
        
        let title = 'No se pudo acceder a la cámara';
        let msg = 'Ocurrió un error al intentar usar la cámara.';
        let canRetry = true;
        
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          title = 'Permiso de cámara denegado';
          msg = 'Necesitamos acceso a la cámara para mostrar la experiencia AR. Ve a la configuración de tu navegador y permite el acceso, luego vuelve a intentar.';
          canRetry = true;
        } else if (err.name === 'NotFoundError') {
          title = 'Cámara no encontrada';
          msg = 'No se detectó una cámara en este dispositivo.';
          canRetry = false;
        } else if (err.name === 'NotReadableError') {
          title = 'Cámara en uso';
          msg = 'La cámara está siendo usada por otra aplicación. Ciérrala y vuelve a intentar.';
          canRetry = true;
        } else if (err.name === 'OverconstrainedError') {
          title = 'Cámara no compatible';
          msg = 'Tu dispositivo no soporta el modo de cámara trasera. Intenta con la cámara frontal.';
          canRetry = true;
        } else if (err.name === 'SecurityError') {
          title = 'Conexión no segura';
          msg = 'AR requiere HTTPS. Asegúrate de acceder por https:// o localhost.';
          canRetry = false;
        }
        
        showErrorScreen(title, msg, canRetry);
      }
    }
    
    function retryCamera() {
      requestCamera();
    }
    
    function showErrorScreen(title, msg, showRetry) {
      loader.classList.add('hidden');
      errorTitle.textContent = title;
      errorText.textContent = msg;
      retryBtn.style.display = showRetry ? 'block' : 'none';
      errorScreen.classList.add('active');
    }
    
    // ===== GIF COMPONENT =====
    AFRAME.registerComponent('gif-texture', {
      schema: { src: { type: 'string' } },
      init: function() {
        const el = this.el;
        const src = this.data.src;
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        
        const apply = () => {
          const mesh = el.getObject3D('mesh');
          if (mesh && mesh.material) {
            mesh.material.map = texture;
            mesh.material.transparent = true;
            mesh.material.needsUpdate = true;
          }
        };
        apply();
        el.addEventListener('model-loaded', apply);
        el.addEventListener('loaded', apply);
        
        if (typeof gifler !== 'undefined') {
          gifler(src).get((err, anim) => {
            if (err) {
              console.error('GIF error:', err);
              return;
            }
            anim.animateInCanvas(canvas);
            const loop = () => { texture.needsUpdate = true; requestAnimationFrame(loop); };
            loop();
          });
        } else {
          const img = new Image();
          img.onload = () => {
            canvas.getContext('2d').drawImage(img, 0, 0, 512, 512);
            texture.needsUpdate = true;
          };
          img.src = src;
        }
      }
    });
    
    // ===== INIT AR =====
    function getExperiences() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    
    function initAR(exp) {
      if (experienceLoaded) return;
      experienceLoaded = true;
      
      document.getElementById('expTitle').textContent = exp.name;
      document.getElementById('expMeta').textContent = exp.target ? 'Target personalizado' : 'Marcador Hiro';
      
      createARContent(exp);
      
      scene.style.display = 'block';
      uiOverlay.style.display = 'block';
      statusPill.style.display = 'block';
      markerGuide.classList.add('active');
      
      loaderTitle.textContent = 'Iniciando cámara…';
      loaderText.textContent = 'Buscando marcador Hiro';
      
      const marker = document.getElementById('hiroMarker');
      marker.addEventListener('markerFound', () => {
        statusPill.textContent = '✅ Marcador detectado';
        statusPill.classList.add('found');
        markerGuide.classList.remove('active');
      });
      marker.addEventListener('markerLost', () => {
        statusPill.textContent = '🔍 Apunta al marcador Hiro';
        statusPill.classList.remove('found');
        markerGuide.classList.add('active');
      });
      
      scene.addEventListener('loaded', () => {
        setTimeout(() => loader.classList.add('hidden'), 600);
      });
      
      // Timeout de seguridad
      setTimeout(() => loader.classList.add('hidden'), 8000);
    }
    
    function createARContent(exp) {
      const isGif = exp.content.type === 'image/gif';
      const anchor = document.getElementById('contentAnchor');
      anchor.innerHTML = '';
      
      if (isGif) {
        const plane = document.createElement('a-plane');
        plane.setAttribute('width', '1.5');
        plane.setAttribute('height', '1.5');
        plane.setAttribute('position', '0 0 0');
        plane.setAttribute('gif-texture', `src: ${exp.content.data}`);
        anchor.appendChild(plane);
      } else {
        const imgAsset = document.createElement('img');
        imgAsset.setAttribute('id', 'arContentImg');
        imgAsset.setAttribute('src', exp.content.data);
        document.getElementById('assetsContainer').appendChild(imgAsset);
        
        const img = document.createElement('a-image');
        img.setAttribute('src', '#arContentImg');
        img.setAttribute('width', '1.5');
        img.setAttribute('height', '1.5');
        img.setAttribute('position', '0 0 0');
        anchor.appendChild(img);
      }
      
      const wrapper = document.createElement('a-entity');
      wrapper.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutElastic');
      while (anchor.firstChild) wrapper.appendChild(anchor.firstChild);
      anchor.appendChild(wrapper);
    }
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
    
    // Handle orientation change
    window.addEventListener('orientationchange', () => {
      setTimeout(() => window.scrollTo(0, 0), 200);
    });
  </script>
</body>
</html>
